# Hardware Sensor Mode — Additional Kconfig
#
# Include this file alongside prj.conf when building in hardware mode.
# It activates the I2C subsystem and the three upstream Zephyr sensor drivers.
# Keeping these separate from prj.conf ensures simulation builds remain clean
# (no I2C subsystem, no sensor drivers, no devicetree requirements).
#
# Build command (hardware mode):
#   west build -p always -b nrf52840dk/nrf52840 \
#     -- -DCONFIG_SENSOR_MODE_HARDWARE=y \
#        -DEXTRA_CONF_FILE=prj_hw.conf
#
# Build command (simulation mode, default):
#   west build -p always -b nrf52840dk/nrf52840

# I2C bus subsystem
CONFIG_I2C=y

# Zephyr sensor subsystem (enables sensor_sample_fetch / sensor_channel_get)
CONFIG_SENSOR=y

# Sensirion SCD4x upstream driver (handles SCD40, SCD41, SCD42, SCD43, SCD44)
# Manages periodic measurement, CRC-8 validation, and channel decoding.
CONFIG_SCD4X=y

# AMS CCS811 upstream driver (handles nWAKE GPIO if wake-gpios in DTS)
# Runs in Mode 1 (1 measurement/second).
CONFIG_CCS811=y

# Sensirion SPS30 upstream driver
# Handles start/stop measurement, data-ready polling, and PM channel decoding.
CONFIG_SPS30=y

# Larger main stack for hardware mode
# (sensor driver init + aggregator thread startup needs more headroom)
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
