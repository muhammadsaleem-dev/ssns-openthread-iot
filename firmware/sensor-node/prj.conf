# Logging & Shell
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=y

# OpenThread Network Configuration
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MANUAL_START=n
CONFIG_OPENTHREAD_NETWORK_NAME="WSN01"
CONFIG_OPENTHREAD_PANID=4661
CONFIG_OPENTHREAD_XPANID="1111111122222222"
CONFIG_OPENTHREAD_CHANNEL=15
CONFIG_OPENTHREAD_NETWORKKEY="112233445566778899aabbccddeeff00"

# Enable IPv6
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IPV6_MLD=n

# CoAP Protocol Stack
CONFIG_COAP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y


# Increase heap for JSON formatting
CONFIG_HEAP_MEM_POOL_SIZE=2048

# FPU (for float math)
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Hardware RNG (for realistic sensor drift)
CONFIG_ENTROPY_GENERATOR=y
