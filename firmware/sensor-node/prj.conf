# Logging & Shell
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=y

# OpenThread Network Configuration
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MANUAL_START=n
CONFIG_OPENTHREAD_NETWORK_NAME="WSN01"
CONFIG_OPENTHREAD_PANID=4661
CONFIG_OPENTHREAD_XPANID="1111111122222222"
CONFIG_OPENTHREAD_CHANNEL=15
CONFIG_OPENTHREAD_NETWORKKEY="112233445566778899aabbccddeeff00"
# Allow sensor nodes to act as Routers (Full Thread Devices).
# This enables the Thread Leader to promote sensors to Router role,
# allowing them to relay packets for each other and form a true mesh.
# CONFIG_OPENTHREAD_MTD is explicitly omitted.

# Enable IPv6
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IPV6_NBR_CACHE=y

# CoAP Protocol Stack
CONFIG_COAP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y


# Increase heap for JSON formatting
CONFIG_HEAP_MEM_POOL_SIZE=2048

# FPU (for float math)
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Hardware RNG (for realistic sensor drift)
CONFIG_ENTROPY_GENERATOR=y

# Non-Volatile Storage (NVS) & Settings
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# Increase Stack Sizes (Prevent MPU Faults)
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# CBOR Encoding
CONFIG_ZCBOR=y

# ==============================================================================
# SENSOR MODE SWITCH
# ==============================================================================
# By default, the firmware builds in SIMULATION mode (no hardware required).
# To build for REAL HARDWARE, uncomment all the lines in the block below.
# (If you prefer not to edit this file, you can instead build from the command line:
#  west build -p always -b nrf52840dk/nrf52840 -- -DCONFIG_SENSOR_MODE_HARDWARE=y -DEXTRA_CONF_FILE=prj_hw.conf)

# --- Hardware Mode Block ---
CONFIG_SENSOR_MODE_HARDWARE=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_I2C_SHELL=y
