# ============================================================
# Docker Compose — OpenThread Smart Monitoring Backend + MongoDB
# ============================================================

services:

  mongodb:
    image: mongo:7
    container_name: openthread-monitoring-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: openthread_monitoring
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    container_name: openthread-monitoring-backend
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/openthread_monitoring
      MONGODB_DATABASE: openthread_monitoring
      SERVER_PORT: 8080
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
