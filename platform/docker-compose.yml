# ============================================================
# SSNS Smart Monitoring System — Full-Stack Docker Orchestration
#
# Starts the complete platform with a single command:
#   docker compose up --build
#
# Services:
#   - MongoDB          (port 27017)
#   - Spring Boot API  (port 8080)
#   - Python Gateway   (internal only)
#   - ML Analytics     (port 8000)
#   - React Dashboard  (port 3000)
#
# NOTE: This does NOT replace individual repo docker-compose
# files. Those continue to work for standalone development.
# ============================================================

services:

  # ── Database ──────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: ssns-monitoring-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ssns_monitoring
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ssns-network

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ssns_monitoring
      MONGODB_DATABASE: ssns_monitoring
      SERVER_PORT: 8080
      # SPRING_PROFILES_ACTIVE: simulator  # Disabled to rely purely on the Python gateway
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ssns-network

  # ── Gateway Simulator ────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "5683:5683/udp"
    environment:
      GATEWAY_MODE: coap
      BACKEND_URL: http://backend:8080/api/sensor-data
      TELEMETRY_INTERVAL: 10
      NODE_COUNT: 4
      LOG_LEVEL: INFO
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ssns-network

  # ── React Dashboard ──────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "3000:80"
    volumes:
      # Override nginx config to use Docker service name for API proxy
      - ./nginx-orchestrated.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ssns-network

  # ── ML Analytics Service ─────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ml-service
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:8080
      POLL_INTERVAL_SECONDS: 15
      BASELINE_WINDOW_SIZE: 20
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ssns-network



networks:
  ssns-network:
    name: ssns-monitoring-network
    driver: bridge

volumes:
  mongo_data:
