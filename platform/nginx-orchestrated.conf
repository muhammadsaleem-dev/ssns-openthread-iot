# ============================================================
# Nginx config for ORCHESTRATED mode (root docker-compose)
# ============================================================

# Proxy API requests to Spring Boot backend (Load Balanced)
# Must be OUTSIDE the server block
upstream backend_api {
    server api-1:8080;
    server api-2:8080;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable seamless HA failover for POST requests (non_idempotent)
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 3;
    }

    # Proxy WebSocket connections for real-time telemetry
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Proxy Swagger UI
    location /swagger-ui/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    # Proxy OpenAPI spec
    location /v3/api-docs {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
