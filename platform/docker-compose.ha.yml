# ============================================================
# SSNS Smart Monitoring System — High Availability (HA) Deployment
#
# Features:
#   - 2x Backend API Replicas (api-1, api-2)
#   - 2x Gateway Workers (gateway-1, gateway-2)
#   - Centralized Redis Queue for distributed processing
#   - Nginx Load Balancer (inside Dashboard)
# ============================================================

services:

  # ── Database ──────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: ssns-monitoring-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ssns_monitoring
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ssns-network

  # ── Redis (Shared Queue & Deduplication) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: ssns-monitoring-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ssns-network

  # ── Backend API (Replica 1) ───────────────────────────────
  api-1:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-1
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ssns_monitoring
      MONGODB_DATABASE: ssns_monitoring
      SERVER_PORT: 8080
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ssns-network

  # ── Backend API (Replica 2) ───────────────────────────────
  api-2:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-2
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ssns_monitoring
      MONGODB_DATABASE: ssns_monitoring
      SERVER_PORT: 8080
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ssns-network

  # ── Load Balancer & Dashboard ───────────────────────────
  # Acts as the entry point for all API and Web traffic
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "3000:80"
      - "8080:80" # Also expose on 8080 to act as a direct API load balancer
    volumes:
      - ./nginx-orchestrated.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
    restart: unless-stopped
    networks:
      - ssns-network

  # ── UDP Load Balancer (Active-Active Gateway Routing) ─────
  coap-proxy:
    image: nginx:alpine
    container_name: coap-proxy
    ports:
      - "5683:5683/udp"
    volumes:
      - ./nginx-udp.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
    restart: unless-stopped
    networks:
      - ssns-network

  # ── Gateway (Instance 1 - Primary CoAP Receiver) ──────────
  gateway-1:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-1
    # Port 5683 is now handled by the coap-proxy service
    environment:
      GATEWAY_MODE: coap
      # Route traffic through the Load Balancer (dashboard)
      BACKEND_URL: http://dashboard/api/sensor-data
      REDIS_URL: redis://redis:6379/0
      TELEMETRY_INTERVAL: 10
      NODE_COUNT: 4
      LOG_LEVEL: INFO
    depends_on:
      - dashboard
      - redis
    restart: unless-stopped
    networks:
      - ssns-network

  # ── Gateway (Instance 2 - Secondary Worker) ───────────────
  # Processes the Redis queue alongside Instance 1
  gateway-2:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-2
    # No port mapping (only one container can bind to host 5683)
    environment:
      GATEWAY_MODE: coap
      BACKEND_URL: http://dashboard/api/sensor-data
      REDIS_URL: redis://redis:6379/0
      TELEMETRY_INTERVAL: 10
      NODE_COUNT: 4
      LOG_LEVEL: INFO
    depends_on:
      - dashboard
      - redis
    restart: unless-stopped
    networks:
      - ssns-network

  # ── ML Analytics Service ─────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ml-service
    ports:
      - "8000:8000"
    environment:
      # Route traffic through the Load Balancer (dashboard)
      BACKEND_URL: http://dashboard
      POLL_INTERVAL_SECONDS: 15
      BASELINE_WINDOW_SIZE: 20
    depends_on:
      - dashboard
    restart: unless-stopped
    networks:
      - ssns-network

networks:
  ssns-network:
    name: ssns-monitoring-network
    driver: bridge

volumes:
  mongo_data:
  redis_data:
