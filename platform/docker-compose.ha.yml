# ============================================================
# SSNS Smart Monitoring System — High Availability (HA) Platform Core
#
# This file runs the Central Management brain:
#   - 2x Redundant Backend APIs (api-1, api-2)
#   - 1x Central Database (MongoDB)
#   - 1x Load Balancer & UI (Dashboard)
#   - 1x ML Analytics Service
# ============================================================

services:

  # ── Database (Central Core) ──────────────────────────────
  mongodb:
    image: mongo:7
    container_name: ssns-monitoring-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ssns_monitoring
      TZ: "Europe/Berlin"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ssns-network

  # ── Backend API (Replica 1) ───────────────────────────────
  api-1:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-1
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ssns_monitoring
      MONGODB_DATABASE: ssns_monitoring
      SERVER_PORT: 8080
      TZ: "Europe/Berlin"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ssns-network

  # ── Backend API (Replica 2) ───────────────────────────────
  api-2:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-2
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ssns_monitoring
      MONGODB_DATABASE: ssns_monitoring
      SERVER_PORT: 8080
      TZ: "Europe/Berlin"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ssns-network

  # ── Load Balancer & Dashboard ───────────────────────────
  # The "Front Door" for all Fog Nodes and Web Users
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "3000:80"
      - "8080:80" # Receives HTTP telemetry from distributed Fog Nodes
    volumes:
      - ./nginx-orchestrated.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
    restart: unless-stopped
    networks:
      - ssns-network

  # ── ML Analytics Service ─────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ml-service
    ports:
      - "8000:8000"
    environment:
      # Polls the local load balancer
      BACKEND_URL: http://dashboard
      POLL_INTERVAL_SECONDS: 15
      BASELINE_WINDOW_SIZE: 15
      TZ: "Europe/Berlin"
    depends_on:
      - dashboard
    restart: unless-stopped
    networks:
      - ssns-network

networks:
  ssns-network:
    name: ssns-monitoring-network
    driver: bridge

volumes:
  mongo_data:
