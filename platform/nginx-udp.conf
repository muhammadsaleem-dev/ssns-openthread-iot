# ============================================================
# Nginx UDP Load Balancer for CoAP Traffic
# Routes incoming radio traffic to active gateway replicas.
# ============================================================

events {
    worker_connections 1024;
}

stream {
    # Send packets to the gateway with the fewest active connections
    upstream coap_gateways {
        least_conn;
        server gateway-1:5683 max_fails=1 fail_timeout=60s;
        server gateway-2:5683 max_fails=1 fail_timeout=60s;
    }

    # Listen on port 5683 (UDP) and proxy to the upstream pool
    server {
        listen 5683 udp;
        proxy_pass coap_gateways;
        proxy_timeout 500ms;
        proxy_responses 1;
    }
}
