# ============================================================
# SSNS Smart Monitoring System — Windows/WSL2 Edge Node
#
# DEFINITIVE INDUSTRIAL STABLE CONFIGURATION
# ------------------------------------------------------------
# 1. Direct Hardware Passthrough via /dev/dev volume mapping
# 2. Automated Radio Stack Recovery
# 3. Native Linux Docker Engine compatibility
# ============================================================

services:

  otbr:
    build:
      context: .
      dockerfile: Dockerfile.otbr-windows
    container_name: ssns-otbr-windows
    privileged: true
    # Maps the entire host device tree for real-time hotplugging
    volumes:
      - "/dev:/dev"
      - "/lib/modules:/lib/modules:ro"
    network_mode: "host"
    
    environment:
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyACM0"
      NAT64: "0"
      DNS64: "0"
      FIREWALL: "0"
      WEB_GUI: "1"
    
    entrypoint:
      - /bin/bash
      - -c
      - |
        # ============================================================
        # SSNS OTBR — Self-Healing Supervisor for Windows/WSL2
        # Survives dongle unplug/replug without container restart.
        # ============================================================

        # ── One-time system initialization ──────────────────────
        rm -f /var/run/dbus/pid
        service dbus start
        service rsyslog start
        sleep 1 && tail -f /var/log/syslog | grep --line-buffered -v -E "UtilAcceptVsock|ipset v6.34|The set with the given name does not exist|Firewall - failed to update ipsets|cannot get LeaderData|Failed to process" | ccze -A &
        # (socat bridge is started after mesh IPv6 address is ready — see identity subshell below)

        CYCLE=0

        # ── Supervisor loop ─────────────────────────────────────
        while true; do
          CYCLE=$$((CYCLE + 1))
          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "  SUPERVISOR: Cycle #$${CYCLE} — Scanning for hardware"
          echo "══════════════════════════════════════════════════════"

          # 1. Wait for dongle to appear
          until [ -e /dev/ttyACM0 ]; do
            echo "STATION: Waiting for nRF52840 on /dev/ttyACM0... (Check usbipd)"
            sleep 2
          done

          echo "STATION: Hardware detected. Preparing radio..."
          chmod 666 /dev/ttyACM0
          sleep 1

          # 2. Clean up stale state from previous cycle
          if [ $$CYCLE -gt 1 ]; then
            echo "CLEANUP: Tearing down stale wpan0 from previous session..."
            ip link set wpan0 down 2>/dev/null || true
            ip link delete wpan0 2>/dev/null || true
            sleep 2
          fi

          # 3. Launch Thread Identity Manager in background
          (
            sleep 5
            until ot-ctl state 2>/dev/null; do echo "SYNC: Waiting for Agent..."; sleep 2; done
            if ot-ctl state | grep -q disabled; then
              echo "SYNC: Initializing WSN01 Mesh Identity..."
              ot-ctl dataset init new >/dev/null && echo "  [OK] Initialized new dataset"
              ot-ctl dataset activetimestamp 1 >/dev/null && echo "  [OK] Set Active Timestamp"
              ot-ctl dataset networkname WSN01 >/dev/null && echo "  [OK] Set Network Name (WSN01)"
              ot-ctl dataset panid 0x1235 >/dev/null && echo "  [OK] Set PAN ID (0x1235)"
              ot-ctl dataset extpanid 1111111122222222 >/dev/null && echo "  [OK] Set Extended PAN ID"
              ot-ctl dataset networkkey 112233445566778899aabbccddeeff00 >/dev/null && echo "  [OK] Set Network Key"
              ot-ctl dataset channel 15 >/dev/null && echo "  [OK] Set Channel (15)"
              ot-ctl dataset meshlocalprefix fd5e:a726:ec55:ee12:: >/dev/null && echo "  [OK] Set Mesh Local Prefix"
              ot-ctl dataset commit active >/dev/null && echo "  [OK] Committed dataset"
              ot-ctl ifconfig up >/dev/null && echo "  [OK] Interface wpan0 UP"
              ot-ctl thread start >/dev/null && echo "  [OK] Thread protocol STARTED"
              ot-ctl leaderweight 255 >/dev/null && echo "  [OK] Leader weight set"
            fi
            ot-ctl netdata register >/dev/null
            # Disable Duplicate Address Detection (DAD) so both routers can safely share the Anycast IP
            sysctl -w net.ipv6.conf.wpan0.accept_dad=0 2>/dev/null || true
            sysctl -w net.ipv6.conf.wpan0.dad_transmits=0 2>/dev/null || true
            ip -6 addr add fd5e:a726:ec55:ee12::1/64 dev wpan0 nodad 2>/dev/null || true
            echo "SYNC: Mesh online. Ready for sensors."
            # ── Thread→Gateway IPv6 bridge ──────────────────────────
            # aiocoap binds to 0.0.0.0 (IPv4 only). Thread sensors send
            # CoAP to fd5e:a726:ec55:ee12::1:5683 (pure IPv6 on wpan0).
            # socat bridges the two: listens on the specific Thread IPv6
            # address (ipv6only=1, no conflict with aiocoap's 0.0.0.0)
            # and forwards each packet to aiocoap at 127.0.0.1:5683.
            socat UDP6-LISTEN:5683,bind=[fd5e:a726:ec55:ee12::1],ipv6only=1,reuseaddr,fork UDP4:127.0.0.1:5683 &
            echo "BRIDGE: CoAP IPv6→IPv4 bridge started (PID $$!)."
          ) &
          IDENTITY_PID=$$!

          # 4. Virtual Hardware Reset (Fixes usbipd buffer lockups)
          echo "SUPERVISOR: Sending virtual hardware reset to radio..."
          stty -F /dev/ttyACM0 0 2>/dev/null || true
          sleep 1
          stty -F /dev/ttyACM0 115200 2>/dev/null || true
          sleep 1

          # 5. Launch otbr-agent (blocks here until it exits/crashes)
          echo "STATION: Launching OTBR Agent (Cycle #$${CYCLE})..."
          /usr/sbin/otbr-agent -I wpan0 -B eth0 -d4 "spinel+hdlc+uart:///dev/ttyACM0" 2>&1 | grep --line-buffered -v -E "ipset v6.34|The set with the given name does not exist|Firewall - failed to update ipsets|cannot get LeaderData|Failed to process request" || true

          # 5. Agent exited — dongle was unplugged or fatal error
          echo ""
          echo "⚠ SUPERVISOR: Agent exited (dongle removed?). Cleaning up..."
          kill $$IDENTITY_PID 2>/dev/null || true
          wait $$IDENTITY_PID 2>/dev/null || true

          # Brief cooldown before next cycle
          echo "SUPERVISOR: Cooldown 3s before next cycle..."
          sleep 3
        done

    restart: always

  gateway:
    build:
      context: ../../platform/gateway
      dockerfile: Dockerfile
    container_name: ssns-gateway-windows
    network_mode: "host"
    environment:
      GATEWAY_MODE: "coap"
      BACKEND_URL: "http://100.98.119.40:8080/api/sensor-data"
      REDIS_URL: "redis://localhost:6379/0"
      LOG_LEVEL: "INFO"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: bash -c "python main.py 2>&1 | ccze -A"
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    container_name: ssns-redis-windows
    network_mode: "host"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data: