# ============================================================
# SSNS Smart Monitoring System — Windows/WSL2 Edge Node
#
# Runs natively on AMD64 WSL2 with direct USB passthrough.
# Connects physical nRF52840 to the Thread mesh and forwards 
# telemetry over Wi-Fi back to the Mac Gateway.
# ============================================================

services:

  otbr:
    # Build a native image with bridging dependencies preinstalled
    build:
      context: .
      dockerfile: Dockerfile.otbr-windows
    container_name: ssns-otbr-windows
    privileged: true
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.forwarding=1
    
    environment:
      RADIO_URL: "spinel+hdlc+uart:///dev/ttyACM0"
      BACKBONE_INTERFACE: "eth0"
      NAT64: "0"
      FIREWALL: "0"
      
    # =========================================================================
    # CUSTOM ENTRYPOINT EXPLANATION
    # -------------------------------------------------------------------------
    # Now routes incoming IPv6 CoAP traffic from the Thread mesh to the 
    # LOCAL gateway container instead of across the network.
    # =========================================================================
    entrypoint: >
      bash -c "(while true; do socat pty,link=/dev/ttyACM0,raw,echo=0 tcp:host.docker.internal:2000 2>/dev/null; sleep 1; done) & \
      socat UDP6-LISTEN:5683,fork,reuseaddr UDP4:gateway:5683 & \
      (until ot-ctl state 2>/dev/null; do sleep 1; done; \
       if ot-ctl state | grep -q disabled; then \
         ot-ctl dataset init new && \
         ot-ctl dataset networkname WSN01 && \
         ot-ctl dataset panid 0x1235 && \
         ot-ctl dataset extpanid 1111111122222222 && \
         ot-ctl dataset networkkey 112233445566778899aabbccddeeff00 && \
         ot-ctl dataset channel 15 && \
         ot-ctl dataset meshlocalprefix fd5e:a726:ec55:ee12:: && \
         ot-ctl dataset commit active && \
         ot-ctl ifconfig up && \
         ot-ctl thread start; \
       fi; \
       sleep 5; \
       ot-ctl netdata register; \
       ip -6 addr add fd5e:a726:ec55:ee12::1/64 dev wpan0) & \
      until [ -e /dev/ttyACM0 ]; do echo 'Waiting for serial bridge...'; sleep 1; done; \
      sleep 2; \
      exec /app/etc/docker/test/docker_entrypoint.sh"
    restart: unless-stopped
    networks:
      - ssns-windows-network

  # ── Fog Gateway (Local Processing) ───────────────────────
  gateway:
    build:
      context: ../../platform/gateway
      dockerfile: Dockerfile
    container_name: ssns-gateway-windows
    environment:
      GATEWAY_MODE: coap
      # CHANGE THIS to your Mac's Tailscale IP if different
      BACKEND_URL: http://100.98.119.40:8080/api/sensor-data
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - ssns-windows-network

  # ── Local Redis (Edge Buffer) ─────────────────────────────
  redis:
    image: redis:alpine
    container_name: ssns-redis-windows
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ssns-windows-network

networks:
  ssns-windows-network:
    name: ssns-windows-network
    driver: bridge
