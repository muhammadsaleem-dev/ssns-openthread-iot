# ============================================================
# SSNS Smart Monitoring System — Native Linux Edge Node
#
# DEFINITIVE INDUSTRIAL STABLE CONFIGURATION
# ------------------------------------------------------------
# 1. Direct Hardware Passthrough via /dev/dev volume mapping
# 2. Automated Radio Stack Recovery
# 3. Bare-Metal Docker Engine performance
# ============================================================

services:

  otbr:
    build:
      context: .
      dockerfile: Dockerfile.otbr-linux
    container_name: ssns-otbr-linux
    env_file:
      - .env
    privileged: true
    
    volumes:
      - "/dev:/dev"
      - "/run/udev:/run/udev:ro"
      - "/lib/modules:/lib/modules:ro"
      - "./scripts/topology_monitor.sh:/usr/local/bin/topology_monitor.sh:ro"
      - "./scripts/linux_startup.sh:/usr/local/bin/linux_startup.sh:ro"
      - "./otbr-data:/data"
    
    network_mode: "host"
    
    environment:
      # --- Thread Mesh Network Configuration ---
      # Hardcoding these prevents Border Routers from booting up and
      # automatically forming isolated "Ghost Partitions" when they lose
      # connection to each other or when containers restart.
      OT_NETWORK_NAME: "SSNS_Mesh"
      OT_PANID: "0x1234"
      OT_EXTPANID: "deadbeefdeadbeef"
      OT_NETWORK_KEY: "00112233445566778899aabbccddeeff"
      OT_CHANNEL: "26"
      OT_MESH_LOCAL_PREFIX: "fd11:22::"
      OT_ACTIVE_TIMESTAMP: "1"
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyACM0"
      NAT64: "0"
      DNS64: "0"
      FIREWALL: "0"
      WEB_GUI: "1"
      GATEWAY_BACKEND_URL: "${GATEWAY_BACKEND_URL}"
    
    entrypoint: /usr/local/bin/linux_startup.sh
    restart: always

  gateway:
    build:
      context: ../../platform/gateway
      dockerfile: Dockerfile
    container_name: ssns-gateway-linux
    env_file:
      - .env
    network_mode: "host"
    environment:
      GATEWAY_MODE: "coap"
      BACKEND_URL: "${GATEWAY_BACKEND_URL}"
      REDIS_URL: "redis://localhost:6379/0"
      LOG_LEVEL: "INFO"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: bash -c "python main.py 2>&1 | ccze -A"
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    container_name: ssns-redis-linux
    network_mode: "host"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data: