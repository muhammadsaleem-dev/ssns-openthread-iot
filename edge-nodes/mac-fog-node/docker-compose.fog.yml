# ============================================================
# SSNS Smart Monitoring System — Mac/Linux Fog Node
#
# Turns this machine into an autonomous edge receiver.
# Includes: OTBR, Local Gateway, and Local Redis Buffer.
# ============================================================

services:

  # ── OpenThread Border Router ─────────────────────────────
  otbr:
    image: openthread/otbr:custom
    container_name: ssns-otbr
    env_file:
      - .env
    privileged: true
    ports:
      - "8081:8080"
    
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.forwarding=1
    
    environment:
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyACM0"
      OT_INFRA_IF: "eth0"
      OT_WEB_LISTEN_ADDR: "0.0.0.0"
      TZ: "Europe/Berlin"
      
    # ROUTING: Sends radio traffic to the LOCAL gateway container
    entrypoint: >
      bash -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y socat iproute2; \
      service dbus start || true; \
      (while true; do socat pty,link=/dev/ttyACM0,raw,echo=0 tcp:host.docker.internal:2000,nodelay 2>/dev/null; sleep 1; done) & \
      socat UDP6-LISTEN:5683,fork,reuseaddr UDP4:gateway:5683 &
      (until ot-ctl state 2>/dev/null; do sleep 1; done; \
       if ot-ctl state | grep -q disabled; then \
         ot-ctl dataset init new >/dev/null && echo '  [OK] Initialized new dataset' && \
         ot-ctl dataset activetimestamp $${OT_ACTIVE_TIMESTAMP} >/dev/null && echo \"  [OK] Set Active Timestamp ($${OT_ACTIVE_TIMESTAMP})\" && \
         ot-ctl dataset networkname $${OT_NETWORK_NAME} >/dev/null && echo \"  [OK] Set Network Name ($${OT_NETWORK_NAME})\" && \
         ot-ctl dataset panid $${OT_PANID} >/dev/null && echo \"  [OK] Set PAN ID ($${OT_PANID})\" && \
         ot-ctl dataset extpanid $${OT_EXTPANID} >/dev/null && echo \"  [OK] Set Extended PAN ID\" && \
         ot-ctl dataset networkkey $${OT_NETWORK_KEY} >/dev/null && echo \"  [OK] Set Network Key\" && \
         ot-ctl dataset channel $${OT_CHANNEL} >/dev/null && echo \"  [OK] Set Channel ($${OT_CHANNEL})\" && \
         ot-ctl dataset meshlocalprefix $${OT_MESH_LOCAL_PREFIX} >/dev/null && echo \"  [OK] Set Mesh Local Prefix\" && \
         ot-ctl dataset commit active >/dev/null && echo '  [OK] Committed dataset' && \
         ot-ctl ifconfig up >/dev/null && echo '  [OK] Interface wpan0 UP' && \
         ot-ctl thread start >/dev/null && echo '  [OK] Thread protocol STARTED'; \
       fi; \
       sleep 5; \
       ot-ctl netdata register >/dev/null; \
       sysctl -w net.ipv6.conf.wpan0.accept_dad=0 2>/dev/null || true && \
       sysctl -w net.ipv6.conf.wpan0.dad_transmits=0 2>/dev/null || true && \
       ip -6 addr add fd5e:a726:ec55:ee12::1/64 dev wpan0 nodad) &
      until [ -e /dev/ttyACM0 ]; do echo 'Waiting for serial bridge...'; sleep 1; done; \
      sleep 2; \
      exec /init"
    restart: unless-stopped
    networks:
      - ssns-fog-network

  # ── Local Fog Gateway (The Parser) ───────────────────────
  gateway:
    build:
      context: ../../platform/gateway
      dockerfile: Dockerfile
    container_name: ssns-gateway-mac-fog
    env_file:
      - .env
    environment:
      GATEWAY_MODE: coap
      BACKEND_URL: ${GATEWAY_BACKEND_URL}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      TZ: "Europe/Berlin"
    command: bash -c "python main.py 2>&1 | ccze -A"
    depends_on:
      - redis
    networks:
      - ssns-fog-network

  # ── Local Redis (Edge Buffer) ─────────────────────────────
  redis:
    image: redis:alpine
    container_name: ssns-redis-mac-fog
    command: redis-server --appendonly yes
    volumes:
      - redis_mac_fog_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ssns-fog-network

networks:
  ssns-fog-network:
    name: ssns-fog-network
    driver: bridge

volumes:
  redis_mac_fog_data:
