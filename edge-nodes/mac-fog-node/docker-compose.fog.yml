# ============================================================
# SSNS Smart Monitoring System — Mac/Linux Fog Node
#
# Turns this machine into an autonomous edge receiver.
# Includes: OTBR, Local Gateway, and Local Redis Buffer.
# ============================================================

services:

  # ── OpenThread Border Router ─────────────────────────────
  otbr:
    image: openthread/otbr:custom
    container_name: ssns-otbr
    env_file:
      - .env
    privileged: true
    ports:
      - "8081:8080"
    
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.forwarding=1
    
    environment:
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyACM0"
      OT_INFRA_IF: "eth0"
      OT_WEB_LISTEN_ADDR: "0.0.0.0"
      TZ: "Europe/Berlin"
      HARDWARE_ID_FILE: "/hardware_id"
    
    volumes:
      - ./scripts/topology_monitor.sh:/usr/local/bin/topology_monitor.sh
      - ./scripts/mac_startup.sh:/usr/local/bin/mac_startup.sh
      - ./.hardware_id:/hardware_id:ro
      
    entrypoint: /usr/local/bin/mac_startup.sh
    restart: unless-stopped
    networks:
      - ssns-fog-network

  # ── Local Fog Gateway (The Parser) ───────────────────────
  gateway:
    build:
      context: ../../platform/gateway
      dockerfile: Dockerfile
    container_name: ssns-gateway-mac-fog
    env_file:
      - .env
    environment:
      GATEWAY_MODE: coap
      BACKEND_URL: ${GATEWAY_BACKEND_URL}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      TZ: "Europe/Berlin"
    command: bash -c "python main.py 2>&1 | ccze -A"
    depends_on:
      - redis
    networks:
      - ssns-fog-network

  # ── Local Redis (Edge Buffer) ─────────────────────────────
  redis:
    image: redis:alpine
    container_name: ssns-redis-mac-fog
    command: redis-server --appendonly yes
    volumes:
      - redis_mac_fog_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ssns-fog-network

networks:
  ssns-fog-network:
    name: ssns-fog-network
    driver: bridge

volumes:
  redis_mac_fog_data:
