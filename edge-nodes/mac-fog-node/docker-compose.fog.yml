# ============================================================
# SSNS Smart Monitoring System — Mac/Linux Fog Node
#
# Turns this machine into an autonomous edge receiver.
# Includes: OTBR, Local Gateway, and Local Redis Buffer.
# ============================================================

services:

  # ── OpenThread Border Router ─────────────────────────────
  otbr:
    image: openthread/otbr:custom
    container_name: ssns-otbr
    privileged: true
    ports:
      - "8081:8080"
    
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.forwarding=1
    
    environment:
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyACM0"
      OT_INFRA_IF: "eth0"
      OT_WEB_LISTEN_ADDR: "0.0.0.0"
      
    # ROUTING: Sends radio traffic to the LOCAL gateway container
    entrypoint: >
      bash -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y socat iproute2; \
      (while true; do socat pty,link=/dev/ttyACM0,raw,echo=0 tcp:host.docker.internal:2000 2>/dev/null; sleep 1; done) & \
      socat UDP6-LISTEN:5683,fork,reuseaddr UDP4:gateway:5683 &
      (until ot-ctl state 2>/dev/null; do sleep 1; done; \
       if ot-ctl state | grep -q disabled; then \
         ot-ctl dataset init new && \
         ot-ctl dataset networkname WSN01 && \
         ot-ctl dataset panid 0x1235 && \
         ot-ctl dataset extpanid 1111111122222222 && \
         ot-ctl dataset networkkey 112233445566778899aabbccddeeff00 && \
         ot-ctl dataset channel 15 && \
         ot-ctl dataset meshlocalprefix fd5e:a726:ec55:ee12:: && \
         ot-ctl dataset commit active && \
         ot-ctl ifconfig up && \
         ot-ctl thread start; \
       fi; \
       sleep 5; \
       ot-ctl netdata register; \
       ip -6 addr add fd5e:a726:ec55:ee12::1/64 dev wpan0) &
      until [ -e /dev/ttyACM0 ]; do echo 'Waiting for serial bridge...'; sleep 1; done; \
      sleep 2; \
      exec /init"
    restart: unless-stopped
    networks:
      - ssns-fog-network

  # ── Local Fog Gateway (The Parser) ───────────────────────
  gateway:
    build:
      context: ../../platform/gateway
      dockerfile: Dockerfile
    container_name: ssns-gateway-mac-fog
    environment:
      GATEWAY_MODE: coap
      # CHANGE THIS: Point to your Mac's Tailscale IP (The Central Core)
      # Since this runs on the same machine as the Core, you can also use 'host.docker.internal'
      BACKEND_URL: http://host.docker.internal:8080/api/sensor-data
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      - redis
    networks:
      - ssns-fog-network

  # ── Local Redis (Edge Buffer) ─────────────────────────────
  redis:
    image: redis:alpine
    container_name: ssns-redis-mac-fog
    command: redis-server --appendonly yes
    volumes:
      - redis_mac_fog_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ssns-fog-network

networks:
  ssns-fog-network:
    name: ssns-fog-network
    driver: bridge

volumes:
  redis_mac_fog_data:
