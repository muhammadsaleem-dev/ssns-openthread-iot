<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 750" width="400" height="750" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <defs>
    <!-- Arrowhead -->
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- L7: Frontend -->
  <rect x="80" y="80" width="240" height="50" rx="6" ry="6" fill="#F9F9F9" stroke="#333333" stroke-width="2"/>
  <text x="200" y="100" text-anchor="middle" font-weight="bold" font-size="12" fill="#000000">Frontend Layer</text>
  <text x="200" y="118" text-anchor="middle" font-size="12" fill="#000000">React Dashboard</text>

  <!-- L6: ML -->
  <rect x="80" y="170" width="240" height="50" rx="6" ry="6" fill="#F9F9F9" stroke="#333333" stroke-width="2"/>
  <text x="200" y="190" text-anchor="middle" font-weight="bold" font-size="12" fill="#000000">Machine-Learning Layer</text>
  <text x="200" y="208" text-anchor="middle" font-size="12" fill="#000000">Anomaly Detection &amp; Forecasting</text>

  <!-- L5: Database (Cylinder) -->
  <path d="M 80 270 C 80 262, 320 262, 320 270 L 320 300 C 320 308, 80 308, 80 300 Z" fill="#F9F9F9" stroke="#333333" stroke-width="2"/>
  <path d="M 80 270 C 80 278, 320 278, 320 270" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="200" y="290" text-anchor="middle" font-weight="bold" font-size="12" fill="#000000">Database Layer</text>
  <text x="200" y="308" text-anchor="middle" font-size="12" fill="#000000">MongoDB Document Store</text>

  <!-- L4: Backend -->
  <rect x="80" y="350" width="240" height="50" rx="6" ry="6" fill="#F9F9F9" stroke="#333333" stroke-width="2"/>
  <text x="200" y="370" text-anchor="middle" font-weight="bold" font-size="12" fill="#000000">Backend Layer</text>
  <text x="200" y="388" text-anchor="middle" font-size="12" fill="#000000">API Services &amp; WebSockets</text>

  <!-- L3: Fog -->
  <rect x="80" y="440" width="240" height="50" rx="6" ry="6" fill="#F9F9F9" stroke="#333333" stroke-width="2"/>
  <text x="200" y="460" text-anchor="middle" font-weight="bold" font-size="12" fill="#000000">Fog Layer</text>
  <text x="200" y="478" text-anchor="middle" font-size="12" fill="#000000">Edge Gateway</text>

  <!-- L2: Network -->
  <rect x="80" y="530" width="240" height="50" rx="6" ry="6" fill="#F9F9F9" stroke="#333333" stroke-width="2"/>
  <text x="200" y="550" text-anchor="middle" font-weight="bold" font-size="12" fill="#000000">Network Layer</text>
  <text x="200" y="568" text-anchor="middle" font-size="12" fill="#000000">OpenThread Mesh</text>

  <!-- L1: Edge -->
  <rect x="80" y="620" width="240" height="50" rx="6" ry="6" fill="#F9F9F9" stroke="#333333" stroke-width="2"/>
  <text x="200" y="640" text-anchor="middle" font-weight="bold" font-size="12" fill="#000000">Edge Layer</text>
  <text x="200" y="658" text-anchor="middle" font-size="12" fill="#000000">Sensor Nodes (nRF52840)</text>

  <!-- Arrows -->
  <line x1="200" y1="620" x2="200" y2="585" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="530" x2="200" y2="495" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="440" x2="200" y2="405" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="350" x2="200" y2="315" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="260" x2="200" y2="225" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="170" x2="200" y2="135" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
